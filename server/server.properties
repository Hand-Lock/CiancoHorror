# Managed server.properties keys — `ch server deploy` sets exactly these on the Exaroton server and
# leaves every other key alone. `ch server:local` mirrors them too (except access-control keys).
# Base keys come from Server Optimization (base/server/overrides/server.properties); `ch base:sync server`
# updates them unless we've changed a value ourselves.

# --- from Server Optimization 26.3-1.0
enforce-secure-profile=false
spawn-protection=0
network-compression-threshold=128
simulation-distance=8
sync-chunk-writes=false

# --- ours
# Offline-mode server with a public address: only whitelisted names may join.
# Whitelist entries must carry OFFLINE uuids (md5 "OfflinePlayer:<name>"), case-sensitive names.
white-list=true
# enforce-whitelist is not managed: Exaroton resets it to false on every start.
